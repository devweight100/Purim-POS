<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>ร้านปุริม POS</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: "Leelawadee UI", "Segoe UI", Tahoma, sans-serif; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; }
    .logo { width: 88px; height: 88px; border-radius: 22px; background: #4f46e5; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(79, 70, 229, .45); }
    .logo div { width: 40px; height: 31px; border-radius: 6px; background: #fff; position: relative; }
    .logo div::before { content: ""; position: absolute; left: 0; right: 0; top: -13px; height: 9px; border-radius: 4px; background: #fff; }
    .logo div::after { content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #4f46e5; left: 14px; top: 10px; }
    h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .5px; }
    .ver { color: #64748b; font-size: 13px; margin-top: -8px; }
    .now { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #c7d2fe; min-height: 28px; text-align: center; }
    .spin { flex: none; width: 22px; height: 22px; border: 3px solid #334155; border-top-color: #818cf8; border-radius: 50%; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .steps { width: min(640px, 92vw); max-height: 30vh; overflow: auto; background: #111c33; border: 1px solid #1e293b; border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #94a3b8; line-height: 1.7; }
    .steps div::before { content: "✓ "; color: #34d399; }
    .steps div:last-child::before { content: "… "; color: #818cf8; }
    .elapsed { color: #64748b; font-size: 12px; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    button { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; cursor: pointer; }
    button:hover { background: #273449; }
    .log { color: #475569; font-size: 11px; text-align: center; word-break: break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><div></div></div>
    <h1>ร้านปุริม POS</h1>
    <div class="ver" id="ver">กำลังเปิดโปรแกรม...</div>
    <div class="now"><div class="spin"></div><span id="msg">กำลังเริ่มโปรแกรม...</span></div>
    <div class="steps" id="steps"><div>เปิดหน้าต่างโปรแกรม</div></div>
    <div class="elapsed" id="elapsed"></div>
    <div class="btns">
      <button type="button" onclick="pick()">🌐 เลือกเครื่องแม่เอง</button>
      <button type="button" id="gpu" onclick="gpu()">🖥️ เปิดใหม่แบบไม่ใช้การ์ดจอ</button>
      <button type="button" onclick="quit()">✖ ปิดโปรแกรม</button>
    </div>
    <div class="log" id="log"></div>
  </div>
  <script>
    var api = window.electronAPI || {};
    var started = Date.now();
    var stepsEl = document.getElementById('steps');
    // called by the main process for every start-up step
    window.addStep = function (text) {
      document.getElementById('msg').textContent = text;
      var last = stepsEl.lastElementChild;
      // repeated progress (e.g. LAN scan 30/254 -> 60/254) replaces the line instead of adding one
      var key = String(text).replace(/[\d/]+/g, '#');
      if (last && last.dataset.key === key) { last.textContent = text; }
      else { var d = document.createElement('div'); d.textContent = text; d.dataset.key = key; stepsEl.appendChild(d); }
      stepsEl.scrollTop = stepsEl.scrollHeight;
    };
    setInterval(function () {
      var s = Math.round((Date.now() - started) / 1000);
      document.getElementById('elapsed').textContent = 'ผ่านไป ' + s + ' วินาที' + (s > 30 ? ' — นานผิดปกติ ลองกด "เลือกเครื่องแม่เอง"' : '');
    }, 1000);
    function pick() { if (api.openServerConfig) api.openServerConfig(); }
    function quit() { if (api.quitApp) api.quitApp(); else window.close(); }
    var gpuOff = false;
    function gpu() { if (api.restartApp) api.restartApp(!gpuOff); }
    if (api.getStartInfo) {
      api.getStartInfo().then(function (info) {
        document.getElementById('ver').textContent = 'เวอร์ชันแอป ' + info.version + ' · การ์ดจอ: ' + (info.gpu === 'off' ? 'ปิด' : 'เปิด');
        document.getElementById('log').textContent = 'บันทึกการทำงาน: ' + info.logPath;
        gpuOff = info.gpu === 'off';
        if (gpuOff) document.getElementById('gpu').textContent = '🖥️ เปิดใหม่แบบใช้การ์ดจอ';
      }).catch(function () {});
    }
  </script>
</body>
</html>
