<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>ร้านปุริม POS</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: "Leelawadee UI", "Segoe UI", Tahoma, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .logo { width: 96px; height: 96px; border-radius: 24px; background: #4f46e5; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(79, 70, 229, .45); }
    .logo div { width: 44px; height: 34px; border-radius: 6px; background: #fff; position: relative; }
    .logo div::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 10px; border-radius: 4px; background: #fff; }
    .logo div::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #4f46e5; left: 16px; top: 11px; }
    h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .5px; }
    p { margin: 0; color: #94a3b8; font-size: 15px; }
    .spin { width: 28px; height: 28px; border: 3px solid #334155; border-top-color: #818cf8; border-radius: 50%; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><div></div></div>
    <h1>ร้านปุริม POS</h1>
    <div class="spin"></div>
    <p id="msg">กำลังเชื่อมต่อเครื่องแม่...</p>
  </div>
</body>
</html>
