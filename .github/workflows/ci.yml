name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos_admin
          POSTGRES_PASSWORD: pos_secret_ci
          POSTGRES_DB: pos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos_admin -d pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pos_admin:pos_secret_ci@localhost:5432/pos_test
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-the-check
      TZ: Asia/Bangkok
      BACKUP_AUTO: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Unit tests
        run: npx jest
      - name: End-to-end tests (fresh database)
        run: npx jest --config ./test/jest-e2e.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # NON-BLOCKING for now: the code base still has ~800 existing lint errors that are being
      # cleaned up separately. Remove continue-on-error once `npm run lint` passes.
      - name: Lint (not blocking yet)
        run: npm run lint
        continue-on-error: true
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos_admin
          POSTGRES_PASSWORD: pos_secret_ci
          POSTGRES_DB: pos_e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos_admin -d pos_e2e_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Playwright's global setup migrates + seeds this database, then starts the backend on 3001
      # (the port next.config.ts rewrites /api to) and `next start` on 3000.
      DATABASE_URL: postgresql://pos_admin:pos_secret_ci@localhost:5432/pos_e2e_test
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-the-check
      TZ: Asia/Bangkok
      BACKUP_AUTO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
